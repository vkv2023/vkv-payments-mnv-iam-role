service:
  type: iam-role
  displayName: IAM Role
  version: "1.0"

parameters:

  RoleName:
    type: string
    required: true
    source: generated
    description: >
      Name of the IAM role generated by the resource factory.
    cloudFormationParameter: RoleName
    namingPattern: "{company}-{businessUnit}-{application}-{environment}-role"
    constraints:
      minLength: 1
      maxLength: 64
      allowedPattern: "[A-Za-z0-9+=,.@_-]+"

  Environment:
    type: string
    required: true
    source: environment
    cloudFormationParameter: Environment
    allowedValues:
      - dev
      - sat
      - uat
      - prd

  Application:
    type: string
    required: true
    source: organization
    cloudFormationParameter: Application
    description: Application name

  BusinessUnit:
    type: string
    required: true
    source: organization
    cloudFormationParameter: BusinessUnit
    description: Business unit owning the IAM role

  ServicePrincipal:
    type: string
    required: true
    source: service
    cloudFormationParameter: ServicePrincipal
    default: ec2.amazonaws.com
    description: >
      AWS service principal that is allowed to assume the IAM role.

  ManagedPolicyArns:
    type: list
    required: false
    source: service
    cloudFormationParameter: ManagedPolicyArns
    description: >
      Comma-separated list of AWS managed or customer managed
      policy ARNs to attach to the IAM role.

  DataClassification:
    type: string
    required: true
    source: organization
    cloudFormationParameter: DataClassification
    default: internal
    allowedValues:
      - public
      - internal
      - confidential
      - restricted

  Criticality:
    type: string
    required: true
    source: organization
    cloudFormationParameter: Criticality
    default: medium
    allowedValues:
      - low
      - medium
      - high
      - critical

  CostCenter:
    type: string
    required: true
    source: organization
    cloudFormationParameter: CostCenter
    description: Enterprise cost center

  Owner:
    type: string
    required: true
    source: organization
    cloudFormationParameter: Owner
    description: Team or individual responsible for the IAM role

  Repository:
    type: string
    required: true
    source: repository
    cloudFormationParameter: Repository
    description: GitHub repository managing the IAM role

outputs:

  RoleName:
    cloudFormationOutput: RoleName
    description: Name of the IAM role

  RoleArn:
    cloudFormationOutput: RoleArn
    description: ARN of the IAM role

  RoleId:
    cloudFormationOutput: RoleId
    description: Unique ID of the IAM role